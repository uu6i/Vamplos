name: VAMPS MUSIC Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-37" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Validate project files
        run: |
          test -f settings.gradle.kts
          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/libs.versions.toml
          test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          test -f audio/decent-usb-audio-driver/build.gradle.kts
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Verify Gradle configuration
        run: gradle --no-daemon --stacktrace help
      - name: Run unit tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :audio:decent-usb-audio-driver:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug
      - name: Verify and stage APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p final-apk
          cp app/build/outputs/apk/debug/app-debug.apk final-apk/VAMPS-MUSIC-debug.apk
          sha256sum final-apk/VAMPS-MUSIC-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAMPS-MUSIC-debug-APK
          path: final-apk/VAMPS-MUSIC-debug.apk
          if-no-files-found: error
          retention-days: 14
